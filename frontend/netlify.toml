[build]
  publish = "dist"
  command = "npm run build"

# SPA Fallback for React Router (e.g. /teacher, /student, /auth)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
